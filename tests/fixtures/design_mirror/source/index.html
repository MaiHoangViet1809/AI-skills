<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Design Mirror Source Fixture</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="shell">
      <section class="panel">
        <p class="eyebrow">Observed source fixture</p>
        <h1>Quiet operational dashboard</h1>
        <p class="lede">A compact visual system with neutral surfaces, blue action roles, and explicit state styles.</p>
        <div class="actions">
          <button class="button primary">Create report</button>
          <button class="button secondary">View queue</button>
          <button class="button primary" disabled>Disabled</button>
        </div>
      </section>
      <section class="card-grid">
        <article class="metric-card selected">
          <span class="label">Pipeline</span>
          <strong>$128k</strong>
        </article>
        <article class="metric-card error">
          <span class="label">Failures</span>
          <strong>7</strong>
        </article>
      </section>
    </main>
  </body>
</html>
