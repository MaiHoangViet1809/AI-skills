<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Design Mirror Target Fixture</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="workspace-panel">
        <p class="caption">Target fixture</p>
        <h1>Operations queue</h1>
        <p class="summary">The target owns its own tokens and component classes before applying the mirrored design.</p>
        <div class="toolbar">
          <button class="control primary">Create report</button>
          <button class="control secondary">View queue</button>
          <button class="control primary" disabled>Disabled</button>
        </div>
      </section>
      <section class="stat-list">
        <article class="stat-card selected">
          <span class="caption">Pipeline</span>
          <strong>$128k</strong>
        </article>
        <article class="stat-card error">
          <span class="caption">Failures</span>
          <strong>7</strong>
        </article>
      </section>
    </main>
  </body>
</html>
